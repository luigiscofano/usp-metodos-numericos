name: Verificacao numerica
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  testes:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest -q
  notebooks:
    runs-on: ubuntu-24.04
    env:
      MPLBACKEND: Agg
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m ipykernel install --user --name python3 --display-name 'Python 3'
      - run: python scripts/verificar_acervo.py
      - run: python scripts/executar_notebooks.py
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: notebooks-executados-html-e-figuras
          path: |
            build/*.ipynb
            build/*.html
            build/*.json
            assets/figuras/*.svg
